<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authority Control Panel — Disaster Alert</title>
  <meta name="description" content="Secure authority control panel for managing and broadcasting disaster alerts.">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    /* ── ADMIN-PAGE-ONLY STYLES ─────────────────────────────── */

    /* Override body overflow for admin since panel is scrollable */
    body {
      overflow: hidden;
    }

    /* admin map occupies the space right of the panel */
    #map {
      position: absolute;
      top: 64px;
      bottom: 0;
      left: 302px;
      /* panel width + gap */
      right: 0;
      z-index: 1;
      transition: left .3s ease;
    }

    /* ── [UPGRADE] Admin panel — widened for card content ─── */
    .panel {
      width: 286px;
      top: 74px;
      left: 10px;
      max-height: calc(100vh - 84px);
      gap: 8px;
      overflow-y: auto;
    }

    /* ── [UPGRADE] Published badge chip ─────────────────── */
    .badge-pub {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--low);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    /* ── [UPGRADE] Publish btn full-width ───────────────── */
    #publishBtn {
      width: 100%;
      margin-top: 2px;
    }

    /* ── [UPGRADE] Broadcast progress bar ──────────────── */
    #broadcastBar {
      height: 3px;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      border-radius: 4px;
      width: 0%;
      transition: width .5s ease;
      margin-top: 4px;
    }

    /* ── [UPGRADE] Pending count badge ───────────────────── */
    #pendingCount {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--critical);
      color: white;
      font-size: 10px;
      font-weight: 700;
      margin-left: 5px;
      vertical-align: middle;
      animation: alarm-blink 1.5s step-start infinite;
      display: none;
    }

    /* ── [UPGRADE] Activity stream inside admin panel ─── */
    #adminActivityList {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .activity-item {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: baseline;
      gap: 5px;
      padding: 3px 0;
      border-bottom: 1px solid rgba(30, 41, 59, 0.4);
      animation: activity-in .3s ease;
    }

    .activity-item:last-child {
      border-bottom: none;
    }

    /* ── [UPGRADE] Preview marker pulse ─────────────────── */
    @keyframes preview-pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(59, 130, 246, .6);
      }

      50% {
        box-shadow: 0 0 0 8px rgba(59, 130, 246, 0);
      }
    }

    .preview-marker-icon div {
      animation: preview-pulse 1.4s ease-in-out infinite;
    }

    .sim-mode-btn {
      width: 100%;
      background: linear-gradient(135deg, rgba(14, 116, 144, 0.42), rgba(3, 105, 161, 0.42));
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #bae6fd;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .sim-mode-btn.active {
      background: linear-gradient(135deg, rgba(22, 163, 74, 0.36), rgba(21, 128, 61, 0.36));
      border-color: rgba(134, 239, 172, 0.45);
      color: #dcfce7;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.25);
    }

    .sim-controls {
      display: none;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      background: rgba(15, 23, 42, 0.55);
      gap: 8px;
      flex-direction: column;
    }

    .sim-controls.open {
      display: flex;
    }

    .sim-hint {
      margin: 0;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .sim-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .sim-count {
      font-size: 11px;
      color: #7dd3fc;
      font-family: 'JetBrains Mono', monospace;
    }

    .sim-stop-btn {
      background: rgba(127, 29, 29, 0.45);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fecaca;
    }

    .sim-stop-btn:hover {
      background: rgba(185, 28, 28, 0.45);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.25);
    }
  </style>
</head>

<body style="display:none">

  <!-- ========================================================
     TOP BAR
     ======================================================== -->
  <div class="topbar">

    <div class="topbar-brand">
      <div class="heartbeat-dot" id="heartbeatDot" title="System connected"></div>
      <span>🛡️</span>
      <span data-i18n="ui.authorityPanel">Authority Control Panel</span>
    </div>

    <div class="topbar-right">
      <div class="sys-status" id="sysStatus" data-i18n="ui.secureSession">SECURE SESSION</div>

      <div class="lang-toggle" aria-label="Language toggle">
        <button id="langEnBtn" class="lang-btn active" type="button">EN</button>
        <button id="langTaBtn" class="lang-btn" type="button">TA</button>
      </div>

      <div id="alarmIndicator">
        <div class="ai-blink"></div>
        <span data-i18n="ui.criticalActive">CRITICAL ACTIVE</span>
      </div>
      <button onclick="logout()"
        style="background:rgba(127,29,29,0.2);border:1px solid rgba(239,68,68,0.3);color:var(--critical);">
        <span data-i18n="ui.logout">Logout</span>
      </button>
    </div>
  </div>

  <!-- ========================================================
     CONTROL PANEL (LEFT)
     ======================================================== -->
  <div class="panel">

    <!-- Manual Alert Section -->
    <h3>📍 <span data-i18n="ui.manualAlert">Manual Alert</span></h3>

    <select id="type">
      <option value="Flood" data-i18n="alertTypes.flood">Flood</option>
      <option value="Fire" data-i18n="alertTypes.fire">Fire</option>
      <option value="Accident" data-i18n="alertTypes.accident">Accident</option>
      <option value="Earthquake" data-i18n="alertTypes.earthquake">Earthquake</option>
      <option value="Cyclone" data-i18n="alertTypes.cyclone">Cyclone</option>
      <option value="Landslide" data-i18n="alertTypes.landslide">Landslide</option>
    </select>

    <select id="level">
      <option value="Low" data-i18n="severity.low">Low</option>
      <option value="Moderate" data-i18n="severity.moderate">Moderate</option>
      <option value="High" data-i18n="severity.high">High</option>
      <option value="Critical" data-i18n="severity.critical">Critical</option>
    </select>

    <input id="desc" placeholder="Short description (optional)">

    <!-- [UPGRADE] Coordinate readout in monospace -->
    <div id="coords">Move mouse over map to pick location</div>

    <!-- [UPGRADE] Named publish button -->
    <button id="publishBtn" onclick="publish()">🚨 <span data-i18n="ui.publishAlert">Publish Alert</span></button>

    <button id="simulationModeBtn" class="sim-mode-btn" type="button">🎬 <span id="simulationModeLabel" data-i18n="ui.simulationModeOff">Simulation Mode: OFF</span></button>

    <div id="simulationControls" class="sim-controls">
      <select id="simDisasterType" aria-label="Simulation disaster type">
        <option value="flood" data-i18n="alertTypes.flood">Flood</option>
        <option value="earthquake" data-i18n="alertTypes.earthquake">Earthquake</option>
        <option value="fire" data-i18n="alertTypes.fire">Fire</option>
      </select>

      <select id="simSeverity" aria-label="Simulation severity">
        <option value="low" data-i18n="severity.low">Low</option>
        <option value="moderate" selected data-i18n="severity.moderate">Moderate</option>
        <option value="high" data-i18n="severity.high">High</option>
        <option value="critical" data-i18n="severity.critical">Critical</option>
      </select>

      <div class="sim-row">
        <button id="simStopAllBtn" type="button" class="sim-stop-btn" data-i18n="ui.stopAllSimulations">Stop All Simulations</button>
        <span id="simActiveCount" class="sim-count">Active: 0</span>
      </div>

      <p class="sim-hint" data-i18n="ui.simulationHint">Simulation data is local only. Click map to place animated disaster waves.</p>
    </div>

    <!-- [UPGRADE] Broadcast progress bar -->
    <div id="broadcastBar"></div>

    <div id="status"></div>

    <hr style="border-color:var(--border);margin:2px 0;">

    <!-- Pending Alerts Section -->
    <h3>
      ⚠️ <span data-i18n="ui.autoDetected">Auto-Detected</span>
      <span id="pendingCount"></span>
    </h3>

    <div id="pendingBox">
      <div style="font-size:12px;color:var(--text-dim);padding:6px 0;" data-i18n="ui.noPendingAlerts">No pending alerts</div>
    </div>

    <hr style="border-color:var(--border);margin:2px 0;">

    <!-- [UPGRADE] Activity Log -->
    <h3>📋 <span data-i18n="ui.sessionLog">Session Log</span></h3>
    <ul id="adminActivityList">
      <li class="activity-item">
        <div class="ai-dot"></div>
        <span>Session started</span>
      </li>
    </ul>

  </div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- [UPGRADE] TOAST CONTAINER -->
  <div id="toastContainer"></div>

  <!-- [UPGRADE] CRITICAL FLASH OVERLAY -->
  <div id="criticalFlash"></div>

  <!-- ========================================================
     RUNTIME CONFIG LOADER
     Must load BEFORE any Firebase initialization
     ======================================================== -->
  <script src="src/bootstrap.js"></script>

  <!-- ========================================================
     MAIN ADMIN MODULE
     ======================================================== -->
  <script type="module" src="src/admin.js"></script>

  <!-- ========================================================
     AUTO-DETECTION MODULE (unchanged logic)
     ======================================================== -->
  <script type="module" src="src/detector.js"></script>

</body>

</html>
